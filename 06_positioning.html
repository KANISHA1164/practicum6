<!DOCTYPE html>
<html>
<head>
    <title>CodeNest Learning Zones</title>

    <style>
        body {
            font-family: Arial;
            background: lightblue;
            padding: 20px;
        }

        .stage {
            position: relative;
            width: 600px;
            height: 400px;
            background: white;
            margin: auto;
        }

        .zone {
            position: absolute;
            width: 40%;
            height: 30%;
            background: lightblue;
            padding: 15px;
        }

        .one {
            top: 10px;
            left: 10px;
        }

        .two {
            top: 10px;
            right: 10px;
        }

        .three {
            bottom: 10px;
            left: 10px;
        }

        .four {
            bottom: 10px;
            right: 10px;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: blue;
            color: white;
            padding: 15px;
            z-index: 2;
        }
    </style>
</head>

<body>

    <h1>CodeNest Practice Zones</h1>

    <div class="stage">

        <div class="zone one">
            HTML Lab
        </div>

        <div class="zone two">
            CSS Lab
        </div>

        <div class="zone three">
            JavaScript Lab
        </div>

        <div class="zone four">
            Project Lab
        </div>

        <div class="center">
            CodeNest Hub
        </div>

    </div>

</body>
</html>
